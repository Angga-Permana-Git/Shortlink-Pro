; =============================================================================
; docker/php.ini - pengaturan PHP untuk aplikasi di dalam container
; =============================================================================

; Upload (FileUpload Filament untuk logo/branding & media)
upload_max_filesize = 16M
post_max_size = 20M

; Memori & eksekusi
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

; Session
session.gc_maxlifetime = 7200

; Display error: biarkan laravel mengatur (APP_DEBUG)
display_errors = Off
log_errors = On

; OpCache (production)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0