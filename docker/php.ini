; =============================================================================
; docker/php.ini - pengaturan PHP untuk aplikasi di dalam container
; =============================================================================

; Upload (FileUpload Filament untuk logo/branding & media).
; Batas logo aplikasi 2 MB, jadi 8 MB sudah longgar. Batas kecil juga
; mengurangi permukaan serangan PHP2Shell (CVE-2026-109618/109619).
upload_max_filesize = 8M
post_max_size = 10M

; Memori & eksekusi
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

; Session
session.gc_maxlifetime = 7200

; Fitur ini menjadi salah satu jalur CVE-2026-109619 (use-after-free).
; Aplikasi tidak memakai upload progress, jadi dimatikan.
session.upload_progress.enabled = Off

; Display error: biarkan laravel mengatur (APP_DEBUG)
display_errors = Off
log_errors = On

; Jangan bocorkan versi PHP di header respons
expose_php = Off

; OpCache (production)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0