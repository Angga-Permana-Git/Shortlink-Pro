# =============================================================================
# nginx host - reverse proxy Shortlink Pro
# =============================================================================
# Alur: Cloudflare (TLS) -> cloudflared -> nginx host -> container 127.0.0.1:9000
#
# Tidak ada TLS di server ini. Origin hanya didengar di loopback supaya tidak
# bisa diakses langsung dari internet tanpa lewat Cloudflare Tunnel.
# =============================================================================

map $http_upgrade $connection_upgrade_shortlink {
    default upgrade;
    ''      close;
}

# Skema yang diteruskan ke aplikasi:
# - lewat Cloudflare/cloudflared -> header X-Forwarded-Proto: https diteruskan
# - diakses langsung via HTTP (LAN / SSH tunnel) -> pakai $scheme (http)
# Tanpa ini, aplikasi selalu mengira dirinya https sehingga tautan yang
# dihasilkan berbunyi https:// padahal origin-nya HTTP.
map $http_x_forwarded_proto $forwarded_proto_shortlink {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Port yang diteruskan ke aplikasi. Symfony membuang port dari header Host,
# jadi port yang dipakai untuk menyusun URL aset/tautan hanya diambil dari
# X-Forwarded-Port:
# - akses lewat SSH tunnel (mis. http://127.0.0.1:9000) -> port dari header Host
# - lewat Cloudflare (https, tanpa port di Host)     -> 443
# - akses HTTP langsung di port 80                   -> 80
# Tanpa ini Symfony memakai SERVER_PORT container (9000) atau 80, sehingga URL
# aset bisa salah dan CSS/JS gagal dimuat.
map $http_host $port_from_host_shortlink {
    ~^.+:(\d+)$  $1;
    default      '';
}

map $forwarded_proto_shortlink $default_port_shortlink {
    default 443;
    http    80;
}

map $port_from_host_shortlink $forwarded_port_shortlink {
    ''      $default_port_shortlink;
    default $port_from_host_shortlink;
}

# Host apa adanya, termasuk port. `$host` membuang port, sehingga aplikasi
# membangun URL aset tanpa port (mis. http://127.0.0.1/build/...) dan CSS/JS
# gagal dimuat saat diakses lewat SSH tunnel pada port selain 80.
map $http_host $host_with_port_shortlink {
    default $http_host;
    ''      $host;
}

server {
    listen 127.0.0.1:80;
    # Nama host yang dilayani, ditulis eksplisit (bukan `_`).
    #
    # `_` adalah catch-all: begitu ada aplikasi kedua di server yang sama,
    # permintaan untuk domain aplikasi lain ikut masuk ke sini dan pengunjung
    # diam-diam melihat aplikasi yang salah tanpa pesan galat apa pun.
    #
    # `localhost` dan `127.0.0.1` tetap didaftarkan supaya akses lewat SSH
    # tunnel (http://127.0.0.1:9000 -> nginx :80) tidak ditolak blok penolak
    # di bawah. nginx mencocokkan nama host tanpa port, jadi `127.0.0.1:9000`
    # tetap cocok dengan `127.0.0.1`.
    server_name __DOMAIN__ localhost 127.0.0.1;

    server_tokens off;

    # Samakan dengan post_max_size PHP (10 MB).
    client_max_body_size 10m;

    keepalive_timeout 65s;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host $host_with_port_shortlink;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Pengunjung memakai HTTPS di sisi Cloudflare, jadi cloudflared mengirim
        # X-Forwarded-Proto: https dan nilai itu diteruskan apa adanya. Akses
        # langsung (HTTP) memakai skema asli lewat map di atas.
        proxy_set_header X-Forwarded-Proto $forwarded_proto_shortlink;
        proxy_set_header X-Forwarded-Host $host_with_port_shortlink;
        proxy_set_header X-Forwarded-Port $forwarded_port_shortlink;

        # WebSocket/Livewire bila nanti diperlukan.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_shortlink;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check ringan untuk monitoring lokal.
    location = /up {
        access_log off;
        proxy_pass http://127.0.0.1:9000/up;
        proxy_set_header Host $host_with_port_shortlink;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_shortlink;
    }
}

# =============================================================================
# Penolak Host tak dikenal (catch-all)
# =============================================================================
# Tanpa blok ini, nginx memakai server pertama sebagai default: permintaan
# dengan Host apa pun (domain lain, hasil pemindaian, salah ketik di
# Cloudflare Tunnel) akan dilayani aplikasi ini.
#
# `return 444` menutup koneksi tanpa mengirim respons apa pun, jadi tidak ada
# informasi aplikasi/versi yang bocor dan tidak ada halaman galat yang bisa
# dipakai menebak isi server.
#
# Saat menambah aplikasi kedua, tambahkan blok `server` baru dengan
# `server_name` domainnya sendiri. Blok ini tetap di sini sebagai jaring
# pengaman dan tidak perlu diubah.
server {
    listen 127.0.0.1:80 default_server;
    server_name _;

    server_tokens off;

    access_log off;
    return 444;
}
