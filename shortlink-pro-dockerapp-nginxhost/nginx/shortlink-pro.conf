# =============================================================================
# nginx host - reverse proxy Shortlink Pro
# =============================================================================
# Alur: Cloudflare (TLS) -> cloudflared -> nginx host -> container 127.0.0.1:9000
#
# Tidak ada TLS di server ini. Origin hanya didengar di loopback supaya tidak
# bisa diakses langsung dari internet tanpa lewat Cloudflare Tunnel.
# =============================================================================

map $http_upgrade $connection_upgrade_shortlink {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:80;
    server_name __DOMAIN__;

    server_tokens off;

    # Samakan dengan post_max_size PHP (10 MB).
    client_max_body_size 10m;

    keepalive_timeout 65s;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Pengunjung selalu memakai HTTPS di sisi Cloudflare. Header ini yang
        # membuat Laravel menghasilkan URL https dan mengirim secure cookie.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # WebSocket/Livewire bila nanti diperlukan.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_shortlink;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check ringan untuk monitoring lokal.
    location = /up {
        access_log off;
        proxy_pass http://127.0.0.1:9000/up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
