# =============================================================================
# Shortlink Pro - produksi all-in-one (app + MySQL di Docker)
# =============================================================================
# Jalankan dari root repo:
#   cp shortlink-pro-dockerapp-nginxhost/.env.example.fulldb shortlink-pro-dockerapp-nginxhost/.env
#   docker compose -f shortlink-pro-dockerapp-nginxhost/docker-compose.fulldb.yaml up -d --build
#
# Port aplikasi hanya dipublikasikan ke 127.0.0.1:9000; nginx di host yang
# meneruskan trafik dari Cloudflare Tunnel.
# =============================================================================

name: shortlink-pro

x-app-common: &app-common
    image: shortlink-pro-app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
        - .env
    read_only: true
    security_opt:
        - no-new-privileges:true
    cap_drop:
        - ALL
    cap_add:
        # Apache master (root) menurunkan hak ke www-data dan mengelola worker.
        - CHOWN
        - SETUID
        - SETGID
        - KILL
    tmpfs:
        - /tmp:size=64m,mode=1777
        - /run:size=16m,mode=755
        - /run/lock:size=8m,mode=1777
        - /var/www/html/bootstrap/cache:size=32m,mode=775
    volumes:
        - app-storage:/var/www/html/storage
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "3"
    healthcheck:
        test:
            [
                "CMD",
                "php",
                "-r",
                "exit(@file_get_contents('http://127.0.0.1:9000/up') === false ? 1 : 0);",
            ]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 120s

services:
    db:
        image: mysql:8.0
        restart: unless-stopped
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            # Kata sandi root tidak pernah masuk environment aplikasi; dibaca
            # dari Docker secret (berkas ./secrets/db_root_password.txt).
            MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
        secrets:
            - db_root_password
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - backend
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETUID
            - SETGID
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent',
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 40s
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    app:
        <<: *app-common
        build:
            context: ..
            dockerfile: shortlink-pro-dockerapp-nginxhost/Dockerfile
            args:
                PHP_VERSION: ${PHP_VERSION:-8.3.36}
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "127.0.0.1:${APP_PORT:-9000}:9000"
        networks:
            - egress
            - backend
        stop_grace_period: 30s

    # Penjadwal Laravel (logs:purge, admin:notify-attention, denyut jadwal).
    # Migrasi hanya dijalankan service app, jadi di sini dimatikan.
    scheduler:
        <<: *app-common
        command: ["php", "artisan", "schedule:work"]
        environment:
            RUN_MIGRATIONS: "false"
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            disable: true
        networks:
            - egress
            - backend

networks:
    egress:
        driver: bridge
    # internal: true -> db tidak punya akses internet sama sekali.
    backend:
        driver: bridge
        internal: true

volumes:
    db-data:
    app-storage:

secrets:
    db_root_password:
        file: ./secrets/db_root_password.txt
