; =============================================================================
; PHP produksi Shortlink Pro
; Dipasang ke /usr/local/etc/php/conf.d/zz-shortlink-pro.ini
; =============================================================================

; --- Tampilan galat ---------------------------------------------------------
; Galat tetap dicatat, tetapi tidak pernah dikirim ke pengunjung.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; --- Batas sumber daya ------------------------------------------------------
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000
post_max_size = 10M
upload_max_filesize = 8M
max_file_uploads = 20
file_uploads = On

; --- Sesi -------------------------------------------------------------------
; session.upload_progress ikut dinonaktifkan sebagai mitigasi PHP2Shell
; (CVE-2026-109619) selain patch versi PHP.
session.upload_progress.enabled = Off
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

; --- URL --------------------------------------------------------------------
allow_url_fopen = On
allow_url_include = Off

; --- OPcache ----------------------------------------------------------------
; Image bersifat immutable: kode tidak berubah tanpa build ulang, jadi
; pengecekan timestamp dimatikan agar tidak ada stat() per request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; --- Filesystem -------------------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Catatan: proc_open/exec TIDAK dimatikan karena scheduler Laravel menjalankan
; perintah terjadwal lewat Symfony Process (proc_open).
