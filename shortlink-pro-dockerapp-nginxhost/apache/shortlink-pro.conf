# =============================================================================
# Virtual host Apache di dalam container (produksi)
# - Hanya menerima koneksi dari jaringan Docker (port dipublikasikan ke
#   127.0.0.1 oleh compose), bukan langsung dari internet.
# - Tidak ada TLS di sini: TLS diterminasi Cloudflare, lalu cloudflared
#   meneruskan HTTP ke nginx host, dan nginx host meneruskan ke container.
# =============================================================================

<VirtualHost *:9000>
    ServerAdmin admin@localhost
    DocumentRoot /var/www/html/public

    # Jangan tampilkan daftar isi direktori.
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.php [L]
    </Directory>

    # Batasi ukuran body agar konsisten dengan post_max_size PHP (10 MB).
    LimitRequestBody 10485760

    # Log ke stdout/stderr container supaya terbaca `docker compose logs`.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
